<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONOFOLD</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>CHRONOFOLD</h1>
    <p>A PUZZLE ABOUT COOPERATING WITH YOUR PAST SELVES</p>
  </header>
  <div class="frame">
    <canvas id="cv" width="960" height="540"></canvas>
    <div class="scan"></div>
  </div>
  <footer>
    <b>←→ / A D</b> move &nbsp; <b>↑ / W / SPACE</b> jump &nbsp; <b>R</b> fold time (spawn echo) &nbsp; <b>Z</b> reset level &nbsp; <b>M</b> mute &nbsp; <b>ESC</b> pause &nbsp; <b>ENTER</b> start / next
  </footer>

<script src="src/levels.js"></script>
<script src="src/game.js"></script>
</body>
</html>
